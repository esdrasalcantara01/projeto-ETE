{% extends 'base.html' %}

{% block content %}

<div class="home">
    
    <div class="container_home">

        <div class="apresentação">
            <h1>Camisas <br>
                Personalizadas <br>
             <span style="color: #d49a32;">do seu jeito</span></h1>
            <h3>Escolha um modelo, Personalize com <br>
                sua ideia e receba na sua região. </h3>

                
            <div class="ver_produtos">
                
                <a href="{{ url_for('produtos') }}">
                    <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    Ver Produtos
                </a>
            </div>


        </div>

        <div class="camisas">
            
            <img src="{{ url_for('static', filename = 'img/camisas.png') }}">
        </div>

    </div>
    
    <div class="destaques">
        <h2>Destaques da Loja</h2>
    
        <div class="destaques_produtos">
            <div class="produto">
                <img src="{{ url_for('static', filename = 'img/Camisa_Anime.jpg')}}">
                <div class="detalhes">
                        <h3>Camisa anime</h3>
                        <h2>R$ 65,00</h2> 

                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
    
    
            <div class="produto">
                <img src="{{ url_for('static', filename = 'img/Camisa_Lobo.jpg')}}">
                <div class="detalhes">
                    <h3>Camisa lobo</h3>
                    <h2>R$ 60,00</h2> 
                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
    
    
            <div class="produto">

                <img src="{{ url_for('static', filename = 'img/Camisa_Tech.jpg')}}">
                <div class="detalhes">
                    <h3>Camisa tech</h3>
                    <h2>R$ 60,00</h2> 
                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
        </div>
    </div>
    
</div>
{% endblock %}
