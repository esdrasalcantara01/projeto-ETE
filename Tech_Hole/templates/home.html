{% extends 'base.html' %}

{% block content %}

<div class="home">
    
    <div class="container_home">

        <div class="apresentação">
            <h1>Camisas <br>
                Personalizadas <br>
             <span style="color: #d49a32;">do seu jeito</span></h1>
            <h3>Escolha um modelo, Personalize com <br>
                sua ideia e receba na sua região. </h3>

                
            <div class="ver_produtos">
                
                <a href="{{ url_for('produtos') }}">
                    <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    Ver Produtos
                </a>
            </div>


        </div>

        <div class="camisas">
            
            <img src="{{ url_for('static', filename = 'img/camisas.png') }}">
        </div>

    </div>
    
    <div class="destaques">
        <h2>Destaques da Loja</h2>
    
        <div class="destaques_produtos">
            <div class="produto">
                <img src="https://patoloco.com.br/resize/imagecache/651555f6f1aacbed847b7847b01e0600.jpeg">
                <div class="detalhes">
                        <h3>Placa de Vídeo</h3>
                        <h2>R$ 20,00</h2>

                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
    
    
            <div class="produto">
                <img src="https://images.tcdn.com.br/img/img_prod/740836/processador_intel_core_i5_14400_14_geracao_lga_1700_3_5ghz_cache_20_mb_oem_tray_24749_3_4a7fae51da927b958bdf2c93cba730e1.png">
                <div class="detalhes">
                    <h3>Processador</h3>
                    <h2>R$ 40,00</h2> 
                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
    
    
            <div class="produto">

                <img src="https://images.tcdn.com.br/img/img_prod/1314128/sandisk_hd_ssd_de_1tb_plus_ssd_sata_iii_de_2_5_polegadas_3631_2_dfa6cc803184e6fdee2d5197f1191255.jpeg">
                <div class="detalhes">
                    <h4>SSD</h4>
                    <h2>R$ 10,00</h2> 
                    <button class="adicionar_carrinho">
                        <img src="{{ url_for('static', filename = 'img/carrinho.png')}}">
                    </button>
                </div>
            </div>
        </div>
    </div>
    
</div>
{% endblock %}
