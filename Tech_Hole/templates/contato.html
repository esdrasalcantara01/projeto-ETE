{% extends 'base.html' %}
{% block content %}

<h1>Fale Conosco:</h1>

<div class="contato">
    
    <form method="post">
        <p>Nome:</p>
        <input type="text" class="input_nome">
            
        <p>E-mail:</p>
        <input type="email" class="input_nome">
    
        <p>Assunto:</p>
        <input type="text" class="input_nome">
    
        <p>Mensagem:</p>
        <textarea  cols="30" rows="10" class="input_nome"></textarea>
        <button type="submit" class="enviar">Enviar</button>
    </form>
    
</div>

{% endblock %}
